# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    # Pin Xcode to a version that still ships XCTestCore.framework at
    # …/Developer/Library/Frameworks/. Xcode 16.3+ removed it from that
    # path, which breaks the Swift 6.0.3 OSS toolchain's `swift test`
    # (dlopen of the test bundle fails with "Library not loaded:
    # @rpath/XCTestCore.framework/Versions/A/XCTestCore").
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.0"
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
